[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-manifest"
version = "0.2.0"
description = "Automated component inventory and system card generator for AI applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ashish Dhillon", email = "ashishdhillon.dev@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
ai-manifest = "ai_manifest.cli:main"

[project.urls]
Homepage = "https://github.com/ashishdhillon/ai-manifest"
Repository = "https://github.com/ashishdhillon/ai-manifest"
Issues = "https://github.com/ashishdhillon/ai-manifest/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
